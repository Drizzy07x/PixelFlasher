name: Build for Ubuntu 24.04

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Build tags'

jobs:
  build_ubuntu_24_04:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system Python, wxPython, and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-wxgtk4.0 \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libnotify-dev \
            libsm-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libsdl2-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base
          python3 --version
          python3 - <<'PY'
          import wx
          print(wx.version())
          PY

      - name: Create virtual environment, install dependencies, verify source, and build
        run: |
          python3 -m venv --system-site-packages myenv
          . myenv/bin/activate
          python --version
          pip install -U pip wheel setuptools
          grep -v -E '^\s*wxPython([<>= ].*)?$' requirements.txt > requirements_no_wx.txt
          pip install -r requirements_no_wx.txt
          python - <<'PY'
          import wx
          print(wx.version())
          PY
          python -m compileall -q PixelFlasher.py self_test.py diagnostics.py platform_utils.py ui
          python --version && pip freeze
          ./build.sh
          mv dist/PixelFlasher dist/PixelFlasher_Ubuntu_24_04
          chmod +x dist/PixelFlasher_Ubuntu_24_04
          dist/PixelFlasher_Ubuntu_24_04 --version
          dist/PixelFlasher_Ubuntu_24_04 --help
          dist/PixelFlasher_Ubuntu_24_04 --self-test
          sha256sum dist/PixelFlasher_Ubuntu_24_04 > dist/PixelFlasher_Ubuntu_24_04.sha256
          cat dist/PixelFlasher_Ubuntu_24_04.sha256
          ls dist
        shell: bash

      - name: Upload Ubuntu 24.04 Artifact
        uses: actions/upload-artifact@v7
        id: upload_artifacts_ubuntu_24_04
        with:
          name: PixelFlasher_Ubuntu_24_04 Artifacts
          path: |
            dist/PixelFlasher_Ubuntu_24_04
            dist/PixelFlasher_Ubuntu_24_04.sha256
