name: Beta smoke checks

on:
  pull_request:
    branches: [ main, master, beta-modern-ui ]
  workflow_dispatch:

jobs:
  self-test:
    name: Self-test (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show version
        run: python PixelFlasher.py --version

      - name: Install CI runtime dependencies
        run: |
          python -c "from pathlib import Path; lines = Path('requirements.txt').read_text().splitlines(True); Path('requirements-ci.txt').write_text(''.join(line for line in lines if not line.lstrip().startswith('wxPython')))"
          python -m pip install -r requirements-ci.txt

      - name: Compile beta-safe modules
        run: |
          python -m py_compile PixelFlasher.py self_test.py diagnostics.py platform_utils.py ui/theme.py ui/icons.py ui/components/models.py tools/create_beta_bundle.py

      - name: Run self-test
        run: python PixelFlasher.py --self-test

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
