name: Beta smoke checks

on:
  pull_request:
    branches: [ main, master, beta-modern-ui ]
  workflow_dispatch:

jobs:
  self-test:
    name: Self-test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show version
        run: python PixelFlasher.py --version

      - name: Install self-test runtime dependencies
        run: python -m pip install darkdetect json5

      - name: Compile beta-safe modules
        run: |
          python -m py_compile PixelFlasher.py self_test.py diagnostics.py platform_utils.py ui/theme.py ui/icons.py ui/components/models.py tools/create_beta_bundle.py

      - name: Run self-test
        run: python PixelFlasher.py --self-test

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Create diagnostics bundle
        run: python PixelFlasher.py --diagnostics --output PixelFlasher-diagnostics.zip

      - name: Create source beta bundle
        run: python tools/create_beta_bundle.py --output-dir dist-beta --label ci-${{ matrix.os }}-py${{ matrix.python }}

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}-py${{ matrix.python }}
          path: PixelFlasher-diagnostics.zip

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: source-bundle-${{ matrix.os }}-py${{ matrix.python }}
          path: dist-beta/*
