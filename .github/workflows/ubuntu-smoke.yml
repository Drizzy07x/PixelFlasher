name: Ubuntu Smoke Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ubuntu_smoke:
    needs: frontend_smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download the verified React WebView bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: react-webview-dist
          path: ui/web/dist

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Set up the pinned OTA runner Java toolchain
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Show Python version
        run: python --version

      - name: Install CI runtime dependencies
        run: |
          python -c "from pathlib import Path; lines = Path('requirements.txt').read_text().splitlines(True); Path('requirements-ci.txt').write_text(''.join(line for line in lines if not line.lstrip().startswith('wxPython')))"
          python -m pip install -r requirements-ci.txt -r requirements-dev.txt

      - name: Export and verify React gettext catalogs
        run: |
          python scripts/export_gettext_json.py --output-dir build/react-i18n
          python scripts/export_gettext_json.py --output-dir build/react-i18n --check

      - name: Rebuild and verify the architecture-neutral OTA runner
        run: |
          python scripts/build_ota_runner.py \
            --check \
            --candidate-commit "$GITHUB_SHA" \
            --evidence-output build/rc1-evidence/ota-runner-reproducibility.json

      - name: Compile core, bridge and modern host modules
        run: |
          python -m py_compile \
            PixelFlasher.py \
            self_test.py \
            diagnostics.py \
            platform_utils.py \
            ui_smoke_contract.py \
            config.py \
            ui/bridge_contract.py \
            ui/core_command_factory.py \
            ui/pages/modern_primary_app.py \
            ui/pages/modern_webview_host.py \
            tools/create_beta_bundle.py
          python -m compileall -q pixelflasher_core

      - name: Run self-test
        run: python PixelFlasher.py --self-test

      - name: Lint the modern Python surface
        run: python -m ruff check pixelflasher_core ui scripts tests

      - name: Type-check the strict modern core
        run: python -m pyright --pythonpath "$(command -v python)" --pythonplatform Linux pixelflasher_core

      - name: Run the Python suite with the RC1 coverage gate
        run: |
          python -m pytest \
            --ignore=tests/test_modern_artifact_boundary.py \
            --ignore=tests/test_modern_primary_experience.py \
            --ignore=tests/test_modern_webview_host_contract.py \
            --ignore=tests/test_upstream_integrations.py \
            --cov=pixelflasher_core \
            --cov=ui.command_registry \
            --cov-report=term-missing \
            --cov-report=json:build/coverage-rc1.json \
            --junitxml=build/pytest-rc1.xml \
            --cov-fail-under=80
          python scripts/generate_python_quality_report.py \
            --coverage build/coverage-rc1.json \
            --junit build/pytest-rc1.xml \
            --candidate-commit "$GITHUB_SHA" \
            --output build/rc1-evidence/python-quality.json

      - name: Retain candidate-bound source quality evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b5404495a51ac035b17c8a35a # v4
        with:
          name: source-quality-${{ github.sha }}
          path: |
            build/rc1-evidence/python-quality.json
            build/rc1-evidence/ota-runner-reproducibility.json
          if-no-files-found: error
          retention-days: 30

  ubuntu_xvfb_dashboard:
    needs: frontend_smoke
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download the verified React WebView bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: react-webview-dist
          path: ui/web/dist

      - name: Install system wxPython and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-venv \
            python3-wxgtk4.0 \
            python3-wxgtk-webview4.0 \
            xvfb \
            xauth

      - name: Install full default-entrypoint dependencies
        run: |
          python3 -m venv --system-site-packages myenv
          grep -v -E '^\s*wxPython([<>= ].*)?$' requirements.txt > requirements-no-wx.txt
          myenv/bin/python -m pip install -U pip wheel setuptools
          myenv/bin/python -m pip install -r requirements-no-wx.txt

      - name: Verify the WebKit WebView backend
        run: |
          myenv/bin/python --version
          xvfb-run -a myenv/bin/python - <<'PY'
          import wx
          import wx.html2 as html2

          app = wx.App(False)
          backend = html2.WebViewBackendWebKit
          if not html2.WebView.IsBackendAvailable(backend):
              raise SystemExit(f"wx WebKit backend is unavailable: {backend}")
          frame = wx.Frame(None)
          view = html2.WebView.New(frame, backend=backend)
          if view is None:
              raise SystemExit("wx WebKit WebView could not be created")
          print(wx.version())
          print(f"Verified wx WebView backend: {backend}")
          frame.Destroy()
          PY

      - name: Prove the source React and bridge startup under Xvfb
        run: |
          set -euo pipefail
          launch_log="$RUNNER_TEMP/pixelflasher-source-default.log"
          config_dir="$RUNNER_TEMP/pixelflasher-source-config"
          smoke_report="$RUNNER_TEMP/pixelflasher-source-ui-smoke.json"
          mkdir -p "$config_dir"

          if ! XDG_CONFIG_HOME="$config_dir" xvfb-run -a \
            myenv/bin/python PixelFlasher.py \
              --ui-smoke-report "$smoke_report" \
              --ui-smoke-timeout 30 \
              --config "$config_dir/PixelFlasher.json" >"$launch_log" 2>&1; then
            cat "$launch_log"
            echo "The source React/WebView bridge did not become ready."
            exit 1
          fi

          cat "$launch_log"
          myenv/bin/python scripts/verify_ui_smoke.py \
            --report "$smoke_report" \
            --expect-platform linux \
            --expect-architecture x86_64

  frontend_smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python for catalog export
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Export gettext catalogs into Vite public assets
        run: |
          python -m pip install polib==1.2.0
          python scripts/generate_bridge_contracts.py --check
          python scripts/verify_react_bridge_commands.py
          python scripts/export_gettext_json.py --output-dir ui/web/public/i18n
          python scripts/export_gettext_json.py --output-dir ui/web/public/i18n --check

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'

      - name: Install the locked frontend toolchain
        working-directory: ui/web
        run: |
          test -f pnpm-lock.yaml
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Test and build the React UI
        working-directory: ui/web
        run: |
          pnpm test:coverage
          pnpm build

      - name: Verify every gettext catalog is in the Vite build
        run: |
          python scripts/export_gettext_json.py --output-dir ui/web/dist/i18n --check
          python scripts/verify_webview_bundle.py ui/web/dist

      - name: Share the verified React WebView bundle with Python smoke jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: react-webview-dist
          path: ui/web/dist
          if-no-files-found: error
