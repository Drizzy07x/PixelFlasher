name: Ubuntu Smoke Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ubuntu_smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Show Python version
        run: python --version

      - name: Compile beta-safe Python modules
        run: |
          python -m py_compile \
            PixelFlasher.py \
            self_test.py \
            diagnostics.py \
            platform_utils.py \
            config.py \
            ui/theme.py \
            ui/icons.py \
            ui/components/models.py \
            ui/pages/dashboard.py \
            ui/pages/dashboard_app.py \
            tools/create_beta_bundle.py

      - name: Run self-test
        run: python PixelFlasher.py --self-test

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
