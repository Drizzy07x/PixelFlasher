name: Build for Ubuntu 22.04

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Build tags'

jobs:
  build_ubuntu_22_04:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up the locked React toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version

      - name: Set up Python
        run: |
          sudo apt update
          sudo apt install software-properties-common -y
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.13
          sudo apt install -y python3.13-venv
          sudo apt install -y python3-pip
          python3.13 --version

      - name: Install wxPython prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.13-dev
          sudo apt-get install -y libgtk-3-dev
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y libgstreamer1.0-dev
          sudo apt-get install -y gstreamer1.0-plugins-base
          sudo apt-get install -y freeglut3-dev
          sudo apt-get install -y libwebkit2gtk-4.0-dev
          sudo apt-get install -y libjpeg-dev
          sudo apt-get install -y libpng-dev
          sudo apt-get install -y libtiff-dev
          sudo apt-get install -y libsdl2-dev
          sudo apt-get install -y libnotify-dev
          sudo apt-get install -y libsm-dev
          sudo apt-get install -y xvfb xauth

      - name: Create virtual environment, install dependencies, and build
        run: |
          python3.13 -m venv myenv
          . myenv/bin/activate
          python --version
          pip install -U pip
          pip install -U six wheel setuptools
          # Try wxPython 4.2.2 wheel, then 4.2.1 wheel, finally fallback to source if both fail
          pip install --only-binary wxPython -U -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 wxPython==4.2.2 || \
          pip install --only-binary wxPython -U -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 wxPython==4.2.1 || \
          pip install -U -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 wxPython
          pip install -r requirements.txt
          if [[ "$GITHUB_REF" == refs/tags/v10.* ]]; then
            python scripts/release_version.py --apply "$GITHUB_REF_NAME"
          fi
          python scripts/build_frontend.py
          xvfb-run -a python - <<'PY'
          import wx
          import wx.html2 as html2

          app = wx.App(False)
          backend = html2.WebViewBackendWebKit
          if not html2.WebView.IsBackendAvailable(backend):
              raise SystemExit(f"wx WebKit backend is unavailable: {backend}")
          frame = wx.Frame(None)
          view = html2.WebView.New(frame, backend=backend)
          if view is None:
              raise SystemExit("wx WebKit WebView could not be created")
          print(f"Verified wx WebView backend: {backend}")
          frame.Destroy()
          PY
          python --version && pip freeze
          PIXELFLASHER_FRONTEND_PREBUILT=1 ./build.sh
          mv dist/PixelFlasher dist/PixelFlasher_Ubuntu_22_04
          chmod +x dist/PixelFlasher_Ubuntu_22_04
          sha256sum dist/PixelFlasher_Ubuntu_22_04 > dist/PixelFlasher_Ubuntu_22_04.sha256
          cat dist/PixelFlasher_Ubuntu_22_04.sha256
          ls dist
        shell: bash

      - name: Verify React and locale assets are inside the executable
        shell: bash
        run: |
          archive_listing="$(myenv/bin/pyi-archive-viewer -b -l dist/PixelFlasher_Ubuntu_22_04 | tr '\\' '/')"
          for asset in \
            ui/web/dist/index.html \
            ui/web/dist/assets/adb-terminal.js \
            ui/web/dist/assets/adb-terminal.css \
            ui/web/dist/i18n/manifest.json \
            ui/web/dist/i18n/en.json \
            ui/web/dist/i18n/es.json \
            ui/web/dist/i18n/fr.json \
            ui/web/dist/i18n/it.json \
            ui/web/dist/i18n/zh_CN.json \
            ui/web/dist/i18n/zh_TW.json
          do
            if ! grep -Fq "$asset" <<<"$archive_listing"; then
              echo "Packaged asset missing from PixelFlasher_Ubuntu_22_04: $asset"
              exit 1
            fi
          done

      - name: Prove packaged React and bridge startup under Xvfb
        run: |
          set -euo pipefail
          launch_log="$RUNNER_TEMP/pixelflasher-ubuntu22-default.log"
          config_dir="$RUNNER_TEMP/pixelflasher-ubuntu22-config"
          pty_report="$RUNNER_TEMP/pixelflasher-ubuntu22-pty-smoke.json"
          smoke_report="$RUNNER_TEMP/pixelflasher-ubuntu22-ui-smoke.json"
          mkdir -p "$config_dir"
          dist/PixelFlasher_Ubuntu_22_04 \
            --pty-smoke-report "$pty_report" \
            --pty-smoke-timeout 10
          myenv/bin/python scripts/verify_pty_smoke.py \
            --report "$pty_report" \
            --expect-platform linux \
            --expect-architecture x86_64
          legacy_raw_report="$RUNNER_TEMP/pixelflasher-ubuntu22-legacy-raw-smoke.json"
          dist/PixelFlasher_Ubuntu_22_04 --legacy-raw-smoke-report "$legacy_raw_report"
          myenv/bin/python scripts/verify_legacy_raw_smoke.py \
            --report "$legacy_raw_report" \
            --expect-platform linux \
            --expect-architecture x86_64
          firmware_report="$RUNNER_TEMP/pixelflasher-ubuntu22-firmware-smoke.json"
          dist/PixelFlasher_Ubuntu_22_04 --firmware-smoke-report "$firmware_report"
          myenv/bin/python scripts/verify_firmware_smoke.py \
            --report "$firmware_report" \
            --expect-platform linux \
            --expect-architecture x86_64
          support_report="$RUNNER_TEMP/pixelflasher-ubuntu22-support-smoke.json"
          dist/PixelFlasher_Ubuntu_22_04 --support-smoke-report "$support_report"
          myenv/bin/python scripts/verify_support_smoke.py \
            --report "$support_report" \
            --expect-platform linux \
            --expect-architecture x86_64
          if ! XDG_CONFIG_HOME="$config_dir" xvfb-run -a \
            dist/PixelFlasher_Ubuntu_22_04 \
              --ui-smoke-report "$smoke_report" \
              --ui-smoke-timeout 30 \
              --config "$config_dir/PixelFlasher.json" >"$launch_log" 2>&1; then
            cat "$launch_log"
            exit 1
          fi
          cat "$launch_log"
          myenv/bin/python scripts/verify_ui_smoke.py \
            --report "$smoke_report" \
            --expect-platform linux \
            --expect-architecture x86_64

      # Upload artifacts Ubuntu 22.04
      - name: Upload Ubuntu 22.04 Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload_artifacts_ubuntu_22_04
        with:
          name: PixelFlasher_Ubuntu_22_04 Artifacts
          path: |
            dist/PixelFlasher_Ubuntu_22_04
            dist/PixelFlasher_Ubuntu_22_04.sha256
