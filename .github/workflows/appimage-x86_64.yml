name: Build AppImage

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Build tags'

jobs:
  build_appimage:
    # Use Ubuntu 22.04 but build with Python 3.13 for modulegraph2 support
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up the locked React toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version

      - name: Set up Python 3.13
        run: |
          sudo apt update
          sudo apt install software-properties-common -y
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.13
          sudo apt install -y python3.13-venv
          sudo apt install -y python3-pip
          python3.13 --version

      - name: Install wxPython prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.13-dev
          sudo apt-get install -y libgtk-3-dev
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y libgstreamer1.0-dev
          sudo apt-get install -y gstreamer1.0-plugins-base
          sudo apt-get install -y freeglut3-dev
          sudo apt-get install -y libwebkit2gtk-4.0-dev
          sudo apt-get install -y libjpeg-dev
          sudo apt-get install -y libpng-dev
          sudo apt-get install -y libtiff-dev
          sudo apt-get install -y libsdl2-dev
          sudo apt-get install -y libnotify-dev
          sudo apt-get install -y libsm-dev
          # Install tools needed for AppImage creation
          sudo apt-get install -y patchelf curl zsync xvfb xauth weston xwayland

      - name: Create virtual environment and install dependencies
        run: |
          python3.13 -m venv myenv
          . myenv/bin/activate
          python --version
          pip install -U pip
          pip install -U six wheel setuptools
          pip install --only-binary wxPython -U -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 wxPython==4.2.2 || \
          pip install --only-binary wxPython -U -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 wxPython==4.2.1 || \
          pip install -U -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 wxPython
          pip install -r requirements.txt
          if [[ "$GITHUB_REF" == refs/tags/v10.* ]]; then
            python scripts/release_version.py --apply "$GITHUB_REF_NAME"
          fi
          python scripts/build_frontend.py
          xvfb-run -a python - <<'PY'
          import wx
          import wx.html2 as html2

          app = wx.App(False)
          backend = html2.WebViewBackendWebKit
          if not html2.WebView.IsBackendAvailable(backend):
              raise SystemExit(f"wx WebKit backend is unavailable: {backend}")
          frame = wx.Frame(None)
          view = html2.WebView.New(frame, backend=backend)
          if view is None:
              raise SystemExit("wx WebKit WebView could not be created")
          print(f"Verified wx WebView backend: {backend}")
          frame.Destroy()
          PY
          python --version && pip freeze
          PIXELFLASHER_FRONTEND_PREBUILT=1 ./build.sh
          ls dist
        shell: bash

      - name: Verify React and locale assets are inside the bundled executable
        shell: bash
        run: |
          archive_listing="$(myenv/bin/pyi-archive_viewer -b -l dist/PixelFlasher)"
          for asset in \
            ui/web/dist/index.html \
            ui/web/dist/assets/adb-terminal.js \
            ui/web/dist/assets/adb-terminal.css \
            ui/web/dist/i18n/manifest.json \
            ui/web/dist/i18n/en.json \
            ui/web/dist/i18n/es.json \
            ui/web/dist/i18n/fr.json \
            ui/web/dist/i18n/it.json \
            ui/web/dist/i18n/zh_CN.json \
            ui/web/dist/i18n/zh_TW.json
          do
            if ! grep -Fq "$asset" <<<"$archive_listing"; then
              echo "Packaged asset missing from AppImage executable: $asset"
              exit 1
            fi
          done

      - name: Create .desktop file
        run: |
          mkdir -p dist
          cat > PixelFlasher.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=PixelFlasher
          Comment=Android Flashing Tool
          Exec=PixelFlasher
          Icon=pixelflasher
          Categories=Utility;Development;
          Terminal=false
          EOF
        shell: bash

      - name: Install AppImage tools
        run: |
          set -euo pipefail
          # Pin the immutable GitHub asset id and verify the audited bytes.
          curl --fail --location \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -o appimagetool.AppImage \
            https://api.github.com/repos/AppImage/appimagetool/releases/assets/324406882
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimagetool.AppImage" | sha256sum --check --strict
          chmod +x appimagetool.AppImage
          ls -la appimagetool.AppImage
        shell: bash

      - name: Create AppImage structure
        run: |
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy the PyInstaller-built executable
          cp dist/PixelFlasher AppDir/usr/bin/

          # Copy icon
          cp images/icon-dark-256.png AppDir/usr/share/icons/hicolor/256x256/apps/pixelflasher.png

          # Create .desktop file
          cat > AppDir/usr/share/applications/PixelFlasher.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=PixelFlasher
          Comment=Android Flashing Tool
          Exec=usr/bin/PixelFlasher
          Icon=pixelflasher
          Categories=Utility;Development;
          Terminal=false
          EOF

          # Create symlink in root AppDir
          ln -sf usr/share/applications/PixelFlasher.desktop AppDir/
          ln -sf usr/share/icons/hicolor/256x256/apps/pixelflasher.png AppDir/

      - name: Create AppRun script
        run: |
          # Create AppRun file
          cat > AppDir/AppRun << EOF
          #!/bin/bash
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          export PATH="\$HERE/usr/bin:\$PATH"
          export LD_LIBRARY_PATH="\$HERE/usr/lib:\$HERE/usr/lib/x86_64-linux-gnu:\$LD_LIBRARY_PATH"
          exec "\$HERE/usr/bin/PixelFlasher" "\$@"
          EOF
          chmod +x AppDir/AppRun

      # Debug: Verify AppDir structure
      - name: Verify AppDir structure
        run: |
          echo "AppDir structure:"
          tree AppDir
          ls -lR AppDir
        shell: bash

      - name: Build AppImage
        run: |
          # Create AppImage # comment out using --appimage-extract-and-run to avoid FUSE dependency
          mkdir -p dist
          ARCH=x86_64 ./appimagetool.AppImage AppDir dist/PixelFlasher-x86_64.AppImage

          # Generate SHA256 checksum
          cd dist
          sha256sum PixelFlasher-x86_64.AppImage > PixelFlasher-x86_64.AppImage.sha256
          cat PixelFlasher-x86_64.AppImage.sha256
          ls -la
        shell: bash

      - name: Prove AppImage React and bridge startup under Xvfb
        run: |
          set -euo pipefail
          launch_log="$RUNNER_TEMP/pixelflasher-appimage-default.log"
          config_dir="$RUNNER_TEMP/pixelflasher-appimage-config"
          pty_report="$RUNNER_TEMP/pixelflasher-appimage-pty-smoke.json"
          smoke_report="$RUNNER_TEMP/pixelflasher-appimage-x11-ui-smoke.json"
          mkdir -p "$config_dir"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/PixelFlasher-x86_64.AppImage \
            --pty-smoke-report "$pty_report" \
            --pty-smoke-timeout 10
          myenv/bin/python scripts/verify_pty_smoke.py \
            --report "$pty_report" \
            --expect-platform linux \
            --expect-architecture x86_64
          legacy_raw_report="$RUNNER_TEMP/pixelflasher-appimage-legacy-raw-smoke.json"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/PixelFlasher-x86_64.AppImage \
            --legacy-raw-smoke-report "$legacy_raw_report"
          myenv/bin/python scripts/verify_legacy_raw_smoke.py \
            --report "$legacy_raw_report" \
            --expect-platform linux \
            --expect-architecture x86_64
          firmware_report="$RUNNER_TEMP/pixelflasher-appimage-firmware-smoke.json"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/PixelFlasher-x86_64.AppImage \
            --firmware-smoke-report "$firmware_report"
          myenv/bin/python scripts/verify_firmware_smoke.py \
            --report "$firmware_report" \
            --expect-platform linux \
            --expect-architecture x86_64
          support_report="$RUNNER_TEMP/pixelflasher-appimage-support-smoke.json"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/PixelFlasher-x86_64.AppImage \
            --support-smoke-report "$support_report"
          myenv/bin/python scripts/verify_support_smoke.py \
            --report "$support_report" \
            --expect-platform linux \
            --expect-architecture x86_64
          if ! XDG_CONFIG_HOME="$config_dir" APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a \
            dist/PixelFlasher-x86_64.AppImage \
              --ui-smoke-report "$smoke_report" \
              --ui-smoke-timeout 30 \
              --config "$config_dir/PixelFlasher.json" >"$launch_log" 2>&1; then
            cat "$launch_log"
            exit 1
          fi
          cat "$launch_log"
          myenv/bin/python scripts/verify_ui_smoke.py \
            --report "$smoke_report" \
            --expect-platform linux \
            --expect-architecture x86_64

      - name: Launch AppImage in a Wayland session through XWayland
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/pixelflasher-wayland"
          launch_log="$RUNNER_TEMP/pixelflasher-appimage-wayland.log"
          config_dir="$RUNNER_TEMP/pixelflasher-appimage-wayland-config"
          smoke_report="$RUNNER_TEMP/pixelflasher-appimage-wayland-ui-smoke.json"
          mkdir -p "$runtime_dir"
          mkdir -p "$config_dir"
          chmod 700 "$runtime_dir"
          XDG_RUNTIME_DIR="$runtime_dir" weston \
            --backend=headless-backend.so \
            --xwayland \
            --socket=wayland-pixelflasher \
            --idle-time=0 >"$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          cleanup() {
            kill "$weston_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if test -S "$runtime_dir/wayland-pixelflasher" &&
              grep -Eq 'xserver listening on display :[0-9]+' "$RUNNER_TEMP/weston.log"; then
              break
            fi
            sleep 1
          done
          test -S "$runtime_dir/wayland-pixelflasher"
          xdisplay="$(
            sed -n 's/.*xserver listening on display \(:[0-9][0-9]*\).*/\1/p' \
              "$RUNNER_TEMP/weston.log" | tail -n 1
          )"
          test -n "$xdisplay"
          if ! timeout 45s env \
            XDG_RUNTIME_DIR="$runtime_dir" \
            XDG_CONFIG_HOME="$config_dir" \
            WAYLAND_DISPLAY=wayland-pixelflasher \
            DISPLAY="$xdisplay" \
            GDK_BACKEND=x11 \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            dist/PixelFlasher-x86_64.AppImage \
              --ui-smoke-report "$smoke_report" \
              --ui-smoke-timeout 30 \
              --config "$config_dir/PixelFlasher.json" >"$launch_log" 2>&1; then
            cat "$launch_log"
            cat "$RUNNER_TEMP/weston.log"
            exit 1
          fi
          cat "$launch_log"
          myenv/bin/python scripts/verify_ui_smoke.py \
            --report "$smoke_report" \
            --expect-platform linux \
            --expect-architecture x86_64

      # Upload artifacts
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PixelFlasher-x86_64.AppImage Artifacts
          path: |
            dist/PixelFlasher-x86_64.AppImage
            dist/PixelFlasher-x86_64.AppImage.sha256
          retention-days: 7

  smoke_clean_image:
    needs: build_appimage
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Install runtime-only WebView dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git libgtk-3-0 libwebkit2gtk-4.0-37 python3 xvfb xauth

      - name: Checkout the receipt verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download the AppImage from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: PixelFlasher-x86_64.AppImage Artifacts
          path: dist

      - name: Prove the packaged UI without build dependencies
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/PixelFlasher-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 dist/PixelFlasher-x86_64.AppImage --self-test
          launch_log="$RUNNER_TEMP/pixelflasher-clean-appimage.log"
          config_dir="$RUNNER_TEMP/pixelflasher-clean-config"
          pty_report="$RUNNER_TEMP/pixelflasher-clean-pty-smoke.json"
          smoke_report="$RUNNER_TEMP/pixelflasher-clean-ui-smoke.json"
          mkdir -p "$config_dir"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/PixelFlasher-x86_64.AppImage \
            --pty-smoke-report "$pty_report" \
            --pty-smoke-timeout 10
          python3 scripts/verify_pty_smoke.py \
            --report "$pty_report" \
            --expect-platform linux \
            --expect-architecture x86_64
          legacy_raw_report="$RUNNER_TEMP/pixelflasher-clean-legacy-raw-smoke.json"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/PixelFlasher-x86_64.AppImage \
            --legacy-raw-smoke-report "$legacy_raw_report"
          python3 scripts/verify_legacy_raw_smoke.py \
            --report "$legacy_raw_report" \
            --expect-platform linux \
            --expect-architecture x86_64
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a \
            dist/PixelFlasher-x86_64.AppImage \
              --ui-smoke-report "$smoke_report" \
              --ui-smoke-timeout 30 \
              --config "$config_dir/PixelFlasher.json" >"${launch_log}" 2>&1
          cat "$launch_log"
          python3 scripts/verify_ui_smoke.py \
            --report "$smoke_report" \
            --expect-platform linux \
            --expect-architecture x86_64
