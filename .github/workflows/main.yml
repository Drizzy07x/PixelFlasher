name: Build and release all platforms

on:
  push:
    branches:
      - "**"
    tags:
      - "v10.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pixelflasher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  windows-x64:
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  windows-arm64:
    uses: ./.github/workflows/windows-arm64.yml
    secrets: inherit

  ubuntu-22:
    uses: ./.github/workflows/ubuntu_22_04.yml
    secrets: inherit

  ubuntu-24:
    uses: ./.github/workflows/ubuntu_24_04.yml
    secrets: inherit

  appimage-x64:
    uses: ./.github/workflows/appimage-x86_64.yml
    secrets: inherit

  macos:
    uses: ./.github/workflows/mac.yml
    secrets: inherit

  release:
    if: ${{ success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v10.') }}
    needs:
      - windows-x64
      - windows-arm64
      - ubuntu-22
      - ubuntu-24
      - appimage-x64
      - macos
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Validate protected release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v10\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "Release tag must be v10.X.Y or v10.X.Y-rc.N" >&2
            exit 1
          fi

      - name: Checkout the tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Prove tag and checkout identify the same commit
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          checkout_commit="$(git rev-parse HEAD)"
          test "${tag_commit}" = "${checkout_commit}"
          test "${checkout_commit}" = "${GITHUB_SHA}"

      - name: Download only artifacts built in this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "* Artifacts"
          path: release
          merge-multiple: true

      - name: Verify the complete platform matrix
        shell: bash
        run: |
          set -euo pipefail
          required=(
            PixelFlasher.exe
            PixelFlasher-arm64.exe
            PixelFlasher_Ubuntu_22_04
            PixelFlasher_Ubuntu_24_04
            PixelFlasher-x86_64.AppImage
            PixelFlasher_MacOS_AppleSilicon.dmg
            PixelFlasher_MacOS_Intel.dmg
          )
          for artifact in "${required[@]}"; do
            test -s "release/${artifact}" || {
              echo "Required same-run artifact is missing: ${artifact}" >&2
              exit 1
            }
          done
          find release -maxdepth 1 -type f -print -exec file {} \;

      - name: Generate a CycloneDX SBOM for release payloads
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release
          format: cyclonedx-json
          output-file: release/pixelflasher-${{ github.ref_name }}.cdx.json

      - name: Generate release manifest and homogeneous checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import platform

          root = pathlib.Path("release")
          files = []
          for path in sorted(root.iterdir()):
              if not path.is_file() or path.name in {"release-manifest.json", "SHA256SUMS", "SHA256SUMS.asc"}:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files.append({"name": path.name, "size": path.stat().st_size, "sha256": digest})
          manifest = {
              "schemaVersion": 1,
              "tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["RELEASE_COMMIT"],
              "workflowRun": os.environ["GITHUB_RUN_ID"],
              "generator": f"Python {platform.python_version()}",
              "files": files,
          }
          (root / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd release
            sha256sum -- * | grep -vE ' (SHA256SUMS|SHA256SUMS.asc)$' > SHA256SUMS
          )
          cat release/SHA256SUMS

      - name: Require and import the release checksum signing key
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_SIGNING_KEY}" || {
            echo "RELEASE_SIGNING_KEY is mandatory for v10 release tags" >&2
            exit 1
          }
          printf '%s' "${RELEASE_SIGNING_KEY}" | gpg --batch --import

      - name: Sign and verify release checksums
        shell: bash
        env:
          RELEASE_SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${RELEASE_SIGNING_PASSPHRASE}" \
            --armor --detach-sign --output release/SHA256SUMS.asc release/SHA256SUMS
          gpg --batch --verify release/SHA256SUMS.asc release/SHA256SUMS

      - name: Attest every release payload from this run
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release/PixelFlasher.exe
            release/PixelFlasher-arm64.exe
            release/PixelFlasher_Ubuntu_22_04
            release/PixelFlasher_Ubuntu_24_04
            release/PixelFlasher-x86_64.AppImage
            release/PixelFlasher_MacOS_AppleSilicon.dmg
            release/PixelFlasher_MacOS_Intel.dmg
            release/release-manifest.json
            release/SHA256SUMS

      - name: Publish the immutable GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PixelFlasher ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: release/*
