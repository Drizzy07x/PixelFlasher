name: Build for Windows 2019

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Build tags'

jobs:
  build_windows_2019:
    runs-on: windows-2019

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.8'

      - name: Set up the locked React toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'

      - name: Activate pnpm
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version

      - name: Create virtual environment
        run: python -m venv myenv
        shell: powershell

      - name: Activate virtual environment
        run: .\myenv\Scripts\Activate.ps1
        shell: powershell

      - name: Install wxPython and build
        run: |
          python --version
          pip install -U six wheel setuptools
          pip install -U wxPython==4.2.2
        shell: powershell

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: List modules and their versions
        run: pip freeze

      - name: Build React UI and gettext assets
        shell: powershell
        run: |
          python scripts/build_frontend.py

      - name: Build application
        run: |
          $env:PIXELFLASHER_FRONTEND_PREBUILT = "1"
          .\build.bat

      - name: Rename the file
        run: mv dist/PixelFlasher.exe dist/PixelFlasher_Win_2019.exe

      - name: Verify React and locale assets are inside the executable
        shell: powershell
        run: |
          $archive = ((python -m PyInstaller.utils.cliutils.archive_viewer -b -l "dist/PixelFlasher_Win_2019.exe") -join "`n").Replace('\', '/')
          $required = @(
            "ui/web/dist/index.html",
            "ui/web/dist/i18n/manifest.json",
            "ui/web/dist/i18n/en.json",
            "ui/web/dist/i18n/es.json",
            "ui/web/dist/i18n/fr.json",
            "ui/web/dist/i18n/it.json",
            "ui/web/dist/i18n/zh_CN.json",
            "ui/web/dist/i18n/zh_TW.json"
          )
          foreach ($asset in $required) {
            if (!$archive.Contains($asset)) {
              Write-Error "Packaged asset missing from PixelFlasher_Win_2019.exe: $asset"
              exit 1
            }
          }

      - name: List contents of dist directory
        run: ls dist

      - name: Sign Windows Executable
        uses: skymatic/code-sign-action@6d68ef9679c6778de22bc1cf52e44f454de3604e # v3
        with:
          certificate: '${{ secrets.CERTIFICATE }}'
          password: '${{ secrets.CERT_PASSWORD }}'
          certificatesha1: '${{ secrets.CERTHASH }}'
          certificatename: '${{ secrets.CERTNAME }}'
          description: 'PixelFlasher'
          timestampUrl: 'http://timestamp.digicert.com'
          folder: 'dist'
          recursive: false

      - name: Get sha256
        run: |
          certutil -hashfile dist/PixelFlasher_Win_2019.exe SHA256 > dist/PixelFlasher_Win_2019.exe.sha256
          cat dist/PixelFlasher_Win_2019.exe.sha256

      - name: List contents of dist directory again
        run: ls dist

      # Upload artifacts Windows 2019
      - name: Upload Windows 2019 Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload_artifacts_windows_2019
        with:
          name: PixelFlasher_Win_2019.exe Artifacts
          path: |
            dist/PixelFlasher_Win_2019.exe
            dist/PixelFlasher_Win_2019.exe.sha256
