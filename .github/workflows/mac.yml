name: Build native macOS packages

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: AppleSilicon
          - runner: macos-15-intel
            arch: x86_64
            label: Intel
    runs-on: ${{ matrix.runner }}
    env:
      SIGN_MACOS: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      KEYCHAIN_PATH: ${{ runner.temp }}/pixelflasher-signing.keychain-db

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Prove the runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'

      - name: Activate pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew uninstall --ignore-dependencies openssl@1.1 || true
          brew install create-dmg imagemagick
          python -m venv myenv
          source myenv/bin/activate
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --only-binary=:all: wxPython==4.2.2
          python -m pip install -r requirements.txt
          python -c 'import platform, wx; print(platform.machine(), wx.version())'

      - name: Build and test the local React application
        shell: bash
        run: |
          set -euo pipefail
          source myenv/bin/activate
          if [[ "$GITHUB_REF" == refs/tags/v10.* ]]; then
            python scripts/release_version.py --apply "$GITHUB_REF_NAME"
          fi
          python scripts/build_frontend.py
          python PixelFlasher.py --self-test
          python -m unittest discover -s tests -v

      - name: Build the native application bundle without a DMG
        shell: bash
        run: |
          set -euo pipefail
          source myenv/bin/activate
          PIXELFLASHER_FRONTEND_PREBUILT=1 PIXELFLASHER_SKIP_DMG=1 ./build.sh
          test -x dist/PixelFlasher.app/Contents/MacOS/PixelFlasher

      - name: Verify native slice and packaged WebView assets
        shell: bash
        run: |
          set -euo pipefail
          binary=dist/PixelFlasher.app/Contents/MacOS/PixelFlasher
          arches="$(lipo -archs "${binary}")"
          test "${arches}" = "${{ matrix.arch }}"
          archive_listing="$(myenv/bin/pyi-archive-viewer -b -l "${binary}" | tr '\\' '/')"
          for asset in \
            ui/web/dist/index.html \
            ui/web/dist/assets/adb-terminal.js \
            ui/web/dist/assets/adb-terminal.css \
            ui/web/dist/i18n/manifest.json \
            ui/web/dist/i18n/en.json \
            ui/web/dist/i18n/es.json \
            ui/web/dist/i18n/fr.json \
            ui/web/dist/i18n/it.json \
            ui/web/dist/i18n/zh_CN.json \
            ui/web/dist/i18n/zh_TW.json
          do
            grep -Fq "${asset}" <<<"${archive_listing}"
          done

      - name: Require signing and notarization credentials for v10 tags
        if: ${{ startsWith(github.ref, 'refs/tags/v10.') && env.SIGN_MACOS != 'true' }}
        shell: bash
        run: |
          echo "Developer ID and notarization secrets are mandatory for v10 release tags." >&2
          exit 1

      - name: Import Developer ID certificate
        if: ${{ env.SIGN_MACOS == 'true' }}
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/pixelflasher.p12"
          printf '%s' "${MACOS_CERTIFICATE}" | base64 --decode > "${certificate}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${certificate}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

      - name: Sign with hardened runtime and verify the app bundle
        if: ${{ env.SIGN_MACOS == 'true' }}
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --deep --options runtime --timestamp \
            --sign "${MACOS_SIGNING_IDENTITY}" dist/PixelFlasher.app
          codesign --verify --deep --strict --verbose=2 dist/PixelFlasher.app
          codesign --display --verbose=4 dist/PixelFlasher.app

      - name: Launch the real packaged application self-test
        shell: bash
        run: |
          set -euo pipefail
          dist/PixelFlasher.app/Contents/MacOS/PixelFlasher --version
          dist/PixelFlasher.app/Contents/MacOS/PixelFlasher --self-test
          pty_report="$RUNNER_TEMP/pixelflasher-pty-smoke-${{ matrix.arch }}.json"
          dist/PixelFlasher.app/Contents/MacOS/PixelFlasher \
            --pty-smoke-report "$pty_report" \
            --pty-smoke-timeout 10
          myenv/bin/python scripts/verify_pty_smoke.py \
            --report "$pty_report" \
            --expect-platform macos \
            --expect-architecture "${{ matrix.arch }}"
          legacy_raw_report="$RUNNER_TEMP/pixelflasher-legacy-raw-smoke-${{ matrix.arch }}.json"
          dist/PixelFlasher.app/Contents/MacOS/PixelFlasher \
            --legacy-raw-smoke-report "$legacy_raw_report"
          myenv/bin/python scripts/verify_legacy_raw_smoke.py \
            --report "$legacy_raw_report" \
            --expect-platform macos \
            --expect-architecture "${{ matrix.arch }}"
          firmware_report="$RUNNER_TEMP/pixelflasher-firmware-smoke-${{ matrix.arch }}.json"
          dist/PixelFlasher.app/Contents/MacOS/PixelFlasher \
            --firmware-smoke-report "$firmware_report"
          myenv/bin/python scripts/verify_firmware_smoke.py \
            --report "$firmware_report" \
            --expect-platform macos \
            --expect-architecture "${{ matrix.arch }}"
          support_report="$RUNNER_TEMP/pixelflasher-support-smoke-${{ matrix.arch }}.json"
          dist/PixelFlasher.app/Contents/MacOS/PixelFlasher \
            --support-smoke-report "$support_report"
          myenv/bin/python scripts/verify_support_smoke.py \
            --report "$support_report" \
            --expect-platform macos \
            --expect-architecture "${{ matrix.arch }}"
          smoke_report="$RUNNER_TEMP/pixelflasher-ui-smoke-${{ matrix.arch }}.json"
          smoke_config="$RUNNER_TEMP/pixelflasher-ui-smoke-${{ matrix.arch }}/PixelFlasher.json"
          mkdir -p "$(dirname "$smoke_config")"
          dist/PixelFlasher.app/Contents/MacOS/PixelFlasher \
            --ui-smoke-report "$smoke_report" \
            --ui-smoke-timeout 30 \
            --config "$smoke_config"
          myenv/bin/python scripts/verify_ui_smoke.py \
            --report "$smoke_report" \
            --expect-platform macos \
            --expect-architecture "${{ matrix.arch }}"

      - name: Create architecture-specific DMG
        shell: bash
        run: |
          set -euo pipefail
          create-dmg dist/PixelFlasher.app
          source_dmg="$(find . -maxdepth 1 -name 'PixelFlasher*.dmg' -print -quit)"
          test -n "${source_dmg}"
          mv "${source_dmg}" "dist/PixelFlasher_MacOS_${{ matrix.label }}.dmg"

      - name: Sign, notarize, staple and assess the DMG
        if: ${{ env.SIGN_MACOS == 'true' }}
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          dmg="dist/PixelFlasher_MacOS_${{ matrix.label }}.dmg"
          codesign --force --timestamp --sign "${MACOS_SIGNING_IDENTITY}" "${dmg}"
          xcrun notarytool submit "${dmg}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait
          xcrun stapler staple "${dmg}"
          xcrun stapler validate "${dmg}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg}"

      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/PixelFlasher_MacOS_${{ matrix.label }}.dmg"
          shasum -a 256 "${dmg}" > "${dmg}.sha256"
          cat "${dmg}.sha256"

      - name: Remove temporary signing keychain
        if: ${{ env.SIGN_MACOS == 'true' }}
        shell: bash
        run: security delete-keychain "${KEYCHAIN_PATH}" || true

      - name: Upload native macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PixelFlasher_MacOS_${{ matrix.label }}.dmg Artifacts
          path: |
            dist/PixelFlasher_MacOS_${{ matrix.label }}.dmg
            dist/PixelFlasher_MacOS_${{ matrix.label }}.dmg.sha256
