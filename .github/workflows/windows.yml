name: Build for Windows

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Build tags'

jobs:
  build_windows:
    runs-on: windows-latest
    env:
      VENV: myenv
      PYTHON_EXE: ${{ github.workspace }}\myenv\Scripts\python.exe
      SIGN_WINDOWS: ${{ github.event_name != 'pull_request' && secrets.CERTIFICATE != '' && secrets.CERT_PASSWORD != '' && secrets.CERTHASH != '' && secrets.CERTNAME != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Set up the locked React toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'

      - name: Activate pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version

      - name: Create virtual environment
        shell: pwsh
        run: python -m venv $env:VENV

      - name: Verify virtual environment
        shell: pwsh
        run: |
          if (!(Test-Path $env:PYTHON_EXE)) {
            Write-Error "Virtual environment Python was not found at: $env:PYTHON_EXE"
            exit 1
          }
          & $env:PYTHON_EXE --version

      - name: Upgrade build tooling
        shell: pwsh
        run: |
          & $env:PYTHON_EXE -m pip install --upgrade pip wheel setuptools

      - name: Install wxPython wheel
        shell: pwsh
        run: |
          & $env:PYTHON_EXE --version
          & $env:PYTHON_EXE -m pip install --only-binary=:all: wxPython==4.2.2

      - name: Install requirements without reinstalling wxPython
        shell: pwsh
        run: |
          (Get-Content requirements.txt) | Where-Object { $_ -notmatch '^\s*wxPython' } | Set-Content requirements_no_wx.txt
          & $env:PYTHON_EXE -m pip install -r requirements_no_wx.txt

      - name: List modules and their versions
        shell: pwsh
        run: |
          & $env:PYTHON_EXE -m pip freeze

      - name: Build React UI and gettext assets
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v10.*') {
            & $env:PYTHON_EXE scripts/release_version.py --apply $env:GITHUB_REF_NAME
          }
          & $env:PYTHON_EXE scripts/build_frontend.py

      - name: Run beta-safe checks before packaging
        shell: pwsh
        run: |
          & $env:PYTHON_EXE -m py_compile PixelFlasher.py self_test.py diagnostics.py platform_utils.py config.py ui/bridge_contract.py ui/core_command_factory.py ui/pages/modern_primary_app.py ui/pages/modern_webview_host.py tools/create_beta_bundle.py
          & $env:PYTHON_EXE -m compileall -q pixelflasher_core
          & $env:PYTHON_EXE PixelFlasher.py --self-test
          & $env:PYTHON_EXE -m unittest discover -s tests -v

      - name: Build application
        shell: pwsh
        run: |
          $env:VIRTUAL_ENV = "${{ github.workspace }}\$env:VENV"
          $env:PATH = "$env:VIRTUAL_ENV\Scripts;$env:PATH"
          $env:PIXELFLASHER_FRONTEND_PREBUILT = "1"
          .\build.bat

      - name: Verify output exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PixelFlasher.exe")) {
            Write-Error "dist/PixelFlasher.exe was not created"
            exit 1
          }
          Get-ChildItem dist

      - name: Verify React and locale assets are inside the executable
        shell: pwsh
        run: |
          $viewer = "${{ github.workspace }}\$env:VENV\Scripts\pyi-archive_viewer.exe"
          $archive = ((& $viewer -b -l "dist/PixelFlasher.exe") -join "`n").Replace('\', '/')
          $required = @(
            "ui/web/dist/index.html",
            "ui/web/dist/assets/adb-terminal.js",
            "ui/web/dist/assets/adb-terminal.css",
            "ui/web/dist/i18n/manifest.json",
            "ui/web/dist/i18n/en.json",
            "ui/web/dist/i18n/es.json",
            "ui/web/dist/i18n/fr.json",
            "ui/web/dist/i18n/it.json",
            "ui/web/dist/i18n/zh_CN.json",
            "ui/web/dist/i18n/zh_TW.json"
          )
          foreach ($asset in $required) {
            if (!$archive.Contains($asset)) {
              Write-Error "Packaged asset missing from PixelFlasher.exe: $asset"
              exit 1
            }
          }

      - name: Sign Windows Executable
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        uses: skymatic/code-sign-action@6d68ef9679c6778de22bc1cf52e44f454de3604e # v3
        with:
          certificate: '${{ secrets.CERTIFICATE }}'
          password: '${{ secrets.CERT_PASSWORD }}'
          certificatesha1: '${{ secrets.CERTHASH }}'
          certificatename: '${{ secrets.CERTNAME }}'
          description: 'PixelFlasher'
          timestampUrl: 'http://timestamp.digicert.com'
          folder: 'dist'
          recursive: false

      - name: Refuse an unsigned v10 release artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v10.') && env.SIGN_WINDOWS != 'true' }}
        shell: pwsh
        run: |
          Write-Error "Windows signing secrets are mandatory for v10 release tags."
          exit 1

      - name: Explain unsigned build
        if: ${{ !startsWith(github.ref, 'refs/tags/v10.') && env.SIGN_WINDOWS != 'true' }}
        shell: pwsh
        run: Write-Host "Windows signing skipped because signing secrets are not configured for this run."

      - name: Verify Authenticode and launch the packaged executable
        shell: pwsh
        run: |
          if ($env:SIGN_WINDOWS -eq 'true') {
            $signature = Get-AuthenticodeSignature -LiteralPath "dist/PixelFlasher.exe"
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              Write-Error "Authenticode verification failed: $($signature.StatusMessage)"
              exit 1
            }
            if ($null -eq $signature.SignerCertificate) {
              Write-Error "Signed executable has no signer certificate."
              exit 1
            }
          }
          & "dist/PixelFlasher.exe" --version
          & "dist/PixelFlasher.exe" --self-test
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Packaged PixelFlasher self-test failed."
            exit $LASTEXITCODE
          }
          $smokeReport = Join-Path $env:RUNNER_TEMP "pixelflasher-ui-smoke-windows.json"
          $smokeConfig = Join-Path $env:RUNNER_TEMP "pixelflasher-ui-smoke-windows\PixelFlasher.json"
          New-Item -ItemType Directory -Force -Path (Split-Path $smokeConfig) | Out-Null
          $smokeProcess = Start-Process -FilePath "dist/PixelFlasher.exe" -ArgumentList @(
            "--ui-smoke-report", $smokeReport, "--ui-smoke-timeout", "30", "--config", $smokeConfig
          ) -WindowStyle Hidden -Wait -PassThru
          if ($smokeProcess.ExitCode -ne 0) {
            Write-Error "Packaged PixelFlasher React/WebView smoke failed."
            exit $smokeProcess.ExitCode
          }
          & $env:PYTHON_EXE scripts/verify_ui_smoke.py --report $smokeReport --expect-platform windows --expect-architecture x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Get sha256
        shell: pwsh
        run: |
          Get-FileHash "dist/PixelFlasher.exe" -Algorithm SHA256 | Select-Object -ExpandProperty Hash > dist/PixelFlasher.exe.sha256
          Get-Content dist/PixelFlasher.exe.sha256

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload_artifacts_windows
        with:
          name: PixelFlasher.exe Artifacts
          path: |
            dist/PixelFlasher.exe
            dist/PixelFlasher.exe.sha256
