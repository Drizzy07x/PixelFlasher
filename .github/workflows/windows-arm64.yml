name: Build for Windows ARM64

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Build tags'

jobs:
  build_windows_arm64:
    runs-on: windows-11-arm
    env:
      VENV: myenv
      PYTHON_EXE: ${{ github.workspace }}\myenv\Scripts\python.exe
      SIGN_WINDOWS: ${{ github.event_name != 'pull_request' && secrets.CERTIFICATE != '' && secrets.CERT_PASSWORD != '' && secrets.CERTHASH != '' && secrets.CERTNAME != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up the locked React toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'

      - name: Activate pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version

      - name: Set up native ARM64 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: 'arm64'

      - name: Install Windows SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@9979bedbf6ae74f038cc338622ba015942ed2408 # v2.4
        with:
          sdk-version: 26100

      - name: Create virtual environment and install wxPython
        shell: pwsh
        run: |
          python -m venv $env:VENV
          $venvPython = ".\myenv\Scripts\python.exe"
          $venvPip = ".\myenv\Scripts\pip.exe"
          & $venvPython -m pip install --upgrade pip
          & $venvPip install --upgrade setuptools wheel build delvewheel requests
          & $venvPip install --only-binary=:all: "https://wxpython.org/Phoenix/snapshot-builds/wxpython-4.2.45988+6573a469-cp313-cp313-win_arm64.whl"
          & $venvPip install pillow numpy six
          & $venvPython -c "import platform, wx; assert platform.machine().upper() in {'ARM64','AARCH64'}; print(platform.machine(), wx.version())"

      - name: Install requirements
        shell: pwsh
        run: |
          $venvPip = ".\myenv\Scripts\pip.exe"
          & $venvPip install --upgrade pyinstaller
          & $venvPip install --only-binary=:all: cryptography==46.0.3
          # Remove wxPython from requirements.txt to prevent overwriting the custom build
          (Get-Content requirements.txt) | Where-Object { $_ -notmatch "wxPython" } | Set-Content requirements_no_wx.txt
          & $venvPip install -r requirements_no_wx.txt -r requirements-dev.txt

      - name: List modules and their versions
        shell: pwsh
        run: |
          .\myenv\Scripts\pip.exe freeze

      - name: Build React UI and gettext assets
        shell: pwsh
        run: |
          $python = ".\myenv\Scripts\python.exe"
          if ($env:GITHUB_REF -like 'refs/tags/v10.*') {
            & $python scripts/release_version.py --apply $env:GITHUB_REF_NAME
          }
          & $python scripts/build_frontend.py

      - name: Build ARM64 application
        shell: pwsh
        run: |
          # Set PYTHONPATH so PyInstaller can find wx in the venv
          $env:PYTHONPATH = ".\myenv\Lib\site-packages;$env:PYTHONPATH"
          $venvPyInstaller = ".\myenv\Scripts\pyinstaller.exe"
          $catalogArguments = @("scripts/verify_platform_tools_catalog.py", "--root", "resources/platform-tools/runtime")
          if ($env:GITHUB_REF -notlike 'refs/tags/v10.*') {
            $catalogArguments += "--allow-missing"
          }
          & ".\myenv\Scripts\python.exe" @catalogArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rootAppCatalogArguments = @("scripts/verify_root_app_catalog.py", "--root", "resources/root-apps/runtime")
          if ($env:GITHUB_REF -notlike 'refs/tags/v10.*') {
            $rootAppCatalogArguments += "--allow-missing"
          }
          & ".\myenv\Scripts\python.exe" @rootAppCatalogArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $firmwareCatalogArguments = @("scripts/verify_firmware_catalog.py", "--root", "resources/firmware/runtime")
          $scrcpyCatalogArguments = @("scripts/verify_scrcpy_catalog.py", "--root", "resources/scrcpy/runtime")
          $updateManifestArguments = @("scripts/verify_update_manifest.py", "--path", "resources/updates/runtime/manifest.json")
          $keyboxRevocationArguments = @("scripts/verify_keybox_revocations.py", "--path", "resources/keybox/revocations.json")
          if ($env:GITHUB_REF -notlike 'refs/tags/v10.*') {
            $firmwareCatalogArguments += "--allow-missing"
            $scrcpyCatalogArguments += "--allow-missing"
            $updateManifestArguments += "--allow-missing"
            $keyboxRevocationArguments += "--allow-missing"
          }
          & ".\myenv\Scripts\python.exe" @firmwareCatalogArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\myenv\Scripts\python.exe" @scrcpyCatalogArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\myenv\Scripts\python.exe" @updateManifestArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\myenv\Scripts\python.exe" @keyboxRevocationArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $venvPyInstaller --log-level=DEBUG --clean --noconfirm build-on-win-arm64.spec

      - name: Verify Output Exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PixelFlasher-arm64.exe")) {
            Write-Error "ARM64 executable not found"
            exit 1
          }
          $headers = (& dumpbin.exe /headers "dist/PixelFlasher-arm64.exe") -join "`n"
          if ($headers -notmatch 'AA64|ARM64') {
            Write-Error "Packaged executable is not a native ARM64 PE image."
            exit 1
          }

      - name: Verify React and locale assets are inside the executable
        shell: pwsh
        run: |
          $viewer = ".\myenv\Scripts\pyi-archive_viewer.exe"
          $archive = ((& $viewer -b -l "dist/PixelFlasher-arm64.exe") -join "`n").Replace('\', '/')
          $required = @(
            "ui/web/dist/index.html",
            "ui/web/dist/assets/adb-terminal.js",
            "ui/web/dist/assets/adb-terminal.css",
            "ui/web/dist/i18n/manifest.json",
            "ui/web/dist/i18n/en.json",
            "ui/web/dist/i18n/es.json",
            "ui/web/dist/i18n/fr.json",
            "ui/web/dist/i18n/it.json",
            "ui/web/dist/i18n/zh_CN.json",
            "ui/web/dist/i18n/zh_TW.json"
          )
          foreach ($asset in $required) {
            if (!$archive.Contains($asset)) {
              Write-Error "Packaged asset missing from PixelFlasher-arm64.exe: $asset"
              exit 1
            }
          }

      - name: Sign Windows ARM64 Executable
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        uses: skymatic/code-sign-action@6d68ef9679c6778de22bc1cf52e44f454de3604e # v3
        with:
          certificate: '${{ secrets.CERTIFICATE }}'
          password: '${{ secrets.CERT_PASSWORD }}'
          certificatesha1: '${{ secrets.CERTHASH }}'
          certificatename: '${{ secrets.CERTNAME }}'
          description: 'PixelFlasher ARM64'
          timestampUrl: 'http://timestamp.digicert.com'
          folder: 'dist'
          recursive: false

      - name: Refuse an unsigned v10 ARM64 release artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v10.') && env.SIGN_WINDOWS != 'true' }}
        shell: pwsh
        run: |
          Write-Error "Windows ARM64 signing secrets are mandatory for v10 release tags."
          exit 1

      - name: Verify Authenticode and launch on native ARM64
        shell: pwsh
        run: |
          if ($env:SIGN_WINDOWS -eq 'true') {
            $signature = Get-AuthenticodeSignature -LiteralPath "dist/PixelFlasher-arm64.exe"
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              Write-Error "Authenticode verification failed: $($signature.StatusMessage)"
              exit 1
            }
          }
          & "dist/PixelFlasher-arm64.exe" --version
          & "dist/PixelFlasher-arm64.exe" --self-test
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Native ARM64 packaged self-test failed."
            exit $LASTEXITCODE
          }
          $ptyReport = Join-Path $env:RUNNER_TEMP "pixelflasher-pty-smoke-windows-arm64.json"
          $ptyProcess = Start-Process -FilePath "dist/PixelFlasher-arm64.exe" -ArgumentList @(
            "--pty-smoke-report=$ptyReport", "--pty-smoke-timeout=10"
          ) -WindowStyle Hidden -Wait -PassThru
          if ($ptyProcess.ExitCode -ne 0) {
            Write-Error "Native ARM64 packaged ConPTY smoke failed."
            exit $ptyProcess.ExitCode
          }
          & $env:PYTHON_EXE scripts/verify_pty_smoke.py --report $ptyReport --expect-platform windows --expect-architecture arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $legacyRawReport = Join-Path $env:RUNNER_TEMP "pixelflasher-legacy-raw-smoke-windows-arm64.json"
          $legacyRawProcess = Start-Process -FilePath "dist/PixelFlasher-arm64.exe" -ArgumentList @(
            "--legacy-raw-smoke-report=$legacyRawReport"
          ) -WindowStyle Hidden -Wait -PassThru
          if ($legacyRawProcess.ExitCode -ne 0) {
            Write-Error "Native ARM64 Legacy Raw smoke failed."
            exit $legacyRawProcess.ExitCode
          }
          & $env:PYTHON_EXE scripts/verify_legacy_raw_smoke.py --report $legacyRawReport --expect-platform windows --expect-architecture arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $firmwareReport = Join-Path $env:RUNNER_TEMP "pixelflasher-firmware-smoke-windows-arm64.json"
          $firmwareProcess = Start-Process -FilePath "dist/PixelFlasher-arm64.exe" -ArgumentList @(
            "--firmware-smoke-report=$firmwareReport"
          ) -WindowStyle Hidden -Wait -PassThru
          if ($firmwareProcess.ExitCode -ne 0) {
            Write-Error "Native ARM64 packaged firmware smoke failed."
            exit $firmwareProcess.ExitCode
          }
          & $env:PYTHON_EXE scripts/verify_firmware_smoke.py --report $firmwareReport --expect-platform windows --expect-architecture arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $supportReport = Join-Path $env:RUNNER_TEMP "pixelflasher-support-smoke-windows-arm64.json"
          $supportProcess = Start-Process -FilePath "dist/PixelFlasher-arm64.exe" -ArgumentList @(
            "--support-smoke-report=$supportReport"
          ) -WindowStyle Hidden -Wait -PassThru
          if ($supportProcess.ExitCode -ne 0) {
            Write-Error "Native ARM64 packaged support smoke failed."
            exit $supportProcess.ExitCode
          }
          & $env:PYTHON_EXE scripts/verify_support_smoke.py --report $supportReport --expect-platform windows --expect-architecture arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeReport = Join-Path $env:RUNNER_TEMP "pixelflasher-ui-smoke-windows-arm64.json"
          $smokeConfig = Join-Path $env:RUNNER_TEMP "pixelflasher-ui-smoke-windows-arm64\PixelFlasher.json"
          New-Item -ItemType Directory -Force -Path (Split-Path $smokeConfig) | Out-Null
          $smokeProcess = Start-Process -FilePath "dist/PixelFlasher-arm64.exe" -ArgumentList @(
            "--ui-smoke-report", $smokeReport, "--ui-smoke-timeout", "30", "--config", $smokeConfig
          ) -WindowStyle Hidden -Wait -PassThru
          if ($smokeProcess.ExitCode -ne 0) {
            Write-Error "Native ARM64 React/WebView smoke failed."
            exit $smokeProcess.ExitCode
          }
          & $env:PYTHON_EXE scripts/verify_ui_smoke.py --report $smokeReport --expect-platform windows --expect-architecture arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA256
        shell: pwsh
        run: |
          Get-FileHash "dist/PixelFlasher-arm64.exe" -Algorithm SHA256 | Select-Object -ExpandProperty Hash > dist/PixelFlasher-arm64.exe.sha256
          Get-Content dist/PixelFlasher-arm64.exe.sha256

      - name: Upload ARM64 Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PixelFlasher-ARM64.exe Artifacts
          path: |
            dist/PixelFlasher-arm64.exe
            dist/PixelFlasher-arm64.exe.sha256

