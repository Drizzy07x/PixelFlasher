name: Beta bug report
description: Report a problem found in a PixelFlasher beta build.
title: "[Beta Bug]: "
labels: ["beta", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing a beta build. Reports without enough detail are hard to fix.
        Please attach the diagnostics ZIP generated by `python PixelFlasher.py --diagnostics` or the packaged app equivalent.
  - type: input
    id: version
    attributes:
      label: PixelFlasher beta version
      placeholder: "Example: v2.0.0-beta.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Ubuntu 24.04
        - Ubuntu 22.04
        - Other Linux
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "Example: Pixel 7 Pro / cheetah"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that triggered the problem.
      placeholder: |
        1. Opened PixelFlasher
        2. Selected firmware ZIP
        3. Clicked Patch Boot
        4. App crashed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics/logs
      description: Attach the diagnostics ZIP or paste the relevant redacted log section.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I did not test destructive flashing actions on my daily-driver phone.
          required: false
        - label: I understand beta builds can fail and may require device recovery.
          required: true
